name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.34.3
      - name: Start Supabase Local Stack
        run: supabase start
      - name: Reset Supabase Database
        run: supabase db reset
      - name: Run Supabase DB RLS and Security Tests
        run: supabase test db
      - name: Verify Generated TypeScript Types Match Database Schema
        run: |
          supabase gen types typescript --local > /tmp/database.ts
          cp /tmp/database.ts packages/types/src/database.ts
          pnpm format
          git diff --exit-code packages/types/src/database.ts
      - name: Upload generated types for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-database-types
          path: packages/types/src/database.ts
